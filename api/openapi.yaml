      type: object
      properties: {enabled: {type: boolean, default: false}, base_environment_id: {type: string}, max_active: {type: integer, default: 10}, ttl_days: {type: integer, default: 7}, cleanup_grace_minutes: {type: integer, default: 60}, from_forks: {type: boolean, default: false}, node_selector: {type: object, additionalProperties: {type: string}}, seed_command: {type: array, items: {type: string}}, strategy: {$ref: '#/components/schemas/Strategy'}}
    ProjectUpdate:
      type: object
      properties: {name: {type: string}, settings: {$ref: '#/components/schemas/ProjectSettings'}, config_source: {type: object, additionalProperties: true}}
    Environment:
      type: object
      properties: {id: {type: string}, project_id: {type: string}, name: {type: string}, slug: {type: string}, kind: {type: string, enum: [production, staging, preview, custom]}, protected: {type: boolean}, base_environment_id: {type: string}, preview: {type: object, properties: {repo: {type: string}, pr_number: {type: integer}, branch: {type: string}, state: {type: string, enum: [creating, active, failed, closing, deleted]}, expires_at: {type: string, format: date-time}, last_push_at: {type: string, format: date-time}, url: {type: string}, urls: {type: array, items: {type: string}}, from_fork: {type: boolean}, waiting_for_label: {type: boolean}, failure_reason: {type: string}, head_sha: {type: string}}}, settings: {type: object, additionalProperties: true}}
    ServiceConfig:
      type: object
      description: "Same shape as one entry of services in polipan.yaml, after defaults. See docs/spec/07-config-as-code.md."
      additionalProperties: true
    Service:
      type: object
      properties:
        id: {type: string}
        environment_id: {type: string}
        name: {type: string}
        type: {type: string, enum: [app, database, worker, cron]}
        source_type: {type: string, enum: [git, image]}
        db_engine: {type: string, enum: [postgres, mysql, mariadb, mongo, redis]}
