      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRuleWrite'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRule'}}}}
    delete:
      operationId: deleteAlertRule
      summary: Delete an alert rule
      tags: [alerts]
      x-permission: alert:manage
      parameters: [{$ref: '#/components/parameters/RuleId'}]
      responses:
        '204': {description: Deleted}
  /alert-rules/{rule_id}/mute:
    post:
      operationId: muteAlertRule
      summary: Mute a rule until a time, with a reason (audited)
      tags: [alerts]
      x-permission: alert:manage
      parameters: [{$ref: '#/components/parameters/RuleId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [until, reason], properties: {until: {type: string, format: date-time}, reason: {type: string}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRule'}}}}
  /alert-instances:
    get:
      operationId: listAlertInstances
      summary: List firing and recently resolved alerts
      tags: [alerts]
      x-permission: alert:read
      parameters: [{name: state, in: query, schema: {type: string, enum: [firing, resolved]}}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AlertInstance'}}, next_cursor: {type: [string, 'null']}}}}}}

components:
  securitySchemes:
    bearerToken: {type: http, scheme: bearer, description: "API token starting with pp_"}
    sessionCookie: {type: apiKey, in: cookie, name: pp_session, description: "Browser session. State-changing requests also need header X-CSRF-Token."}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
    From: {name: from, in: query, schema: {type: string, format: date-time}}
    To: {name: to, in: query, schema: {type: string, format: date-time}}
    Step: {name: step, in: query, schema: {type: string, example: 60s}}
    MetricNames: {name: metrics, in: query, required: true, schema: {type: array, items: {type: string, enum: [cpu, memory, network_in, network_out, disk, requests, status_5xx_rate, latency_p50, latency_p95, latency_p99, restarts, load]}}}
    ProviderId: {name: provider_id, in: path, required: true, schema: {type: string}}
    UserId: {name: user_id, in: path, required: true, schema: {type: string}}
    TeamId: {name: team_id, in: path, required: true, schema: {type: string}}
    TokenId: {name: token_id, in: path, required: true, schema: {type: string}}
    NodeId: {name: node_id, in: path, required: true, schema: {type: string}}
    ProjectId: {name: project_id, in: path, required: true, schema: {type: string}}
    EnvironmentId: {name: environment_id, in: path, required: true, schema: {type: string}}
    ServiceId: {name: service_id, in: path, required: true, schema: {type: string}}
    DeploymentId: {name: deployment_id, in: path, required: true, schema: {type: string}}
    ReleaseId: {name: release_id, in: path, required: true, schema: {type: string}}
    DomainId: {name: domain_id, in: path, required: true, schema: {type: string}}
    VolumeId: {name: volume_id, in: path, required: true, schema: {type: string}}
    VariableId: {name: variable_id, in: path, required: true, schema: {type: string}}
    SecretId: {name: secret_id, in: path, required: true, schema: {type: string}}
    Version: {name: version, in: path, required: true, schema: {type: integer}}
    ConnectionId: {name: connection_id, in: path, required: true, schema: {type: string}}
    TargetId: {name: target_id, in: path, required: true, schema: {type: string}}
    PolicyId: {name: policy_id, in: path, required: true, schema: {type: string}}
    ChannelId: {name: channel_id, in: path, required: true, schema: {type: string}}
    RuleId: {name: rule_id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string, description: "Stable machine code, for example domain_in_use, managed_by_git, last_owner, plan_changed"}
        message: {type: string}
        details: {type: object, additionalProperties: true}
        request_id: {type: string}
    Health:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [ok, degraded]}, database: {type: boolean}, queue_lag_seconds: {type: number}, victoria_metrics: {type: boolean}, victoria_logs: {type: boolean}}
    Role: {type: string, enum: [owner, admin, developer, viewer]}
    Strategy: {type: string, enum: [recreate, blue_green, canary]}
    DeploymentState:
      type: string
      enum: [queued, building, image_ready, starting, health_checking, shifting, switching, draining, live, failed, rolled_back, cancelled, superseded]
    User:
      type: object
      properties: {id: {type: string}, email: {type: string}, name: {type: string}, totp_enabled: {type: boolean}, created_at: {type: string, format: date-time}}
    Me:
      type: object
      properties:
        user: {$ref: '#/components/schemas/User'}
        org_role: {$ref: '#/components/schemas/Role'}
        project_roles: {type: array, items: {$ref: '#/components/schemas/ProjectRole'}}
    Session:
      type: object
      properties: {id: {type: string}, ip: {type: string}, user_agent: {type: string}, created_at: {type: string, format: date-time}, expires_at: {type: string, format: date-time}, current: {type: boolean}}
    Org:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        slug: {type: string}
        sso_required: {type: boolean}
        settings: {$ref: '#/components/schemas/OrgSettings'}
    OrgSettings:
      type: object
      properties:
        default_domain_suffix: {type: string}
        preview_domain: {type: string}
        metrics_retention_days: {type: integer, default: 90}
        logs_retention_days: {type: integer, default: 30}
        confirm_retention_shrink: {type: boolean, writeOnly: true, description: "Needed when a retention gets shorter: older data is deleted (409 retention_shrink_needs_confirm)"}
        audit_retention_days: {type: integer, default: 365}
        require_2fa: {type: boolean, default: false}
        allow_private_targets: {type: boolean, default: false}
        allow_owner_password: {type: boolean, default: true}
        acme_email: {type: string}
        acme_dns_provider: {type: object, description: "DNS-01 provider name and credential secret id", additionalProperties: true}
    OrgUpdate:
      type: object
