        warnings: {type: array, items: {$ref: '#/components/schemas/Warning'}, description: "for example zero_downtime_not_available (a database always uses recreate) and database_exposed"}
        config: {$ref: '#/components/schemas/ServiceConfig'}
        git_managed_fields: {type: array, items: {type: string}}
        status: {type: string, enum: [no_release, deploying, running, degraded, stopped, failed]}
        desired_state: {type: string, enum: [running, stopped]}
        failover: {type: string, enum: [none, auto]}
        allow_data_loss_failover: {type: boolean}
        failover_status: {$ref: '#/components/schemas/FailoverStatus'}
        last_backup_at: {type: string, format: date-time, description: "volume services: the end of the last successful backup (REQ-NODE-007)"}
