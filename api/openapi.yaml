        id: {type: string}
        service_id: {type: string}
        number: {type: integer}
        image_digest: {type: string}
        image_ref: {type: string}
        config_snapshot: {$ref: '#/components/schemas/ServiceConfig'}
        variables: {type: object, additionalProperties: {type: string}, description: "Plain variables only"}
        secret_versions: {type: object, additionalProperties: {type: integer}, description: "Secret name to version number. Never values."}
        source: {type: object, properties: {type: {type: string}, commit_sha: {type: string}, branch: {type: string}, pr_number: {type: integer}, promoted_from_release_id: {type: string}, rollback_of_release_id: {type: string}}}
        note: {type: string}
        status: {type: string, enum: [live, previous, available, pruned]}
        fast_rollback_possible: {type: boolean}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    PromoteRequest:
