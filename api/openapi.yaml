    get:
      operationId: streamServiceLogs
      summary: SSE live tail (last 200 lines, then new lines)
      tags: [observability]
      x-permission: logs:read
      parameters: [{$ref: '#/components/parameters/ServiceId'}]
      responses:
        '200': {description: Event stream, content: {text/event-stream: {schema: {$ref: '#/components/schemas/LogLine'}}}}
  /logs/search:
    get:
      operationId: searchLogs
      summary: Search logs by text and fields (LogsQL subset)
      tags: [observability]
      x-permission: logs:read
      parameters:
        - {name: q, in: query, schema: {type: string}, description: "Free text, a phrase in quotes, or /regex/"}
        - {name: project_id, in: query, schema: {type: string}}
        - {name: environment_id, in: query, schema: {type: string}}
        - {name: service_id, in: query, schema: {type: string}}
        - {name: release_id, in: query, schema: {type: string}}
        - {name: node_id, in: query, schema: {type: string}}
        - {name: level, in: query, schema: {type: string, enum: [debug, info, warn, error, unknown]}}
        - {name: stream, in: query, schema: {type: string, enum: [stdout, stderr]}}
        - {name: context, in: query, schema: {type: integer, minimum: 0, maximum: 20, default: 0}, description: "Lines before and after each match"}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
