      properties: {state: {type: string, enum: [healthy, blocked, moving, moved]}, reason: {type: string}, data_lost_since: {type: string, format: date-time}, at: {type: string, format: date-time}}
    Project:
      type: object
      properties: {id: {type: string}, name: {type: string}, slug: {type: string}, settings: {$ref: '#/components/schemas/ProjectSettings'}, config_source: {type: object, properties: {repo: {type: string}, branch: {type: string}, path: {type: string}, connection_id: {type: string}}}, config_sync_state: {type: string, enum: [in_sync, drifted, plan_pending, apply_failed]}, created_at: {type: string, format: date-time}}
    ProjectSettings:
