      parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {name: dry_run, in: query, schema: {type: boolean}}, {name: skip_unsafe, in: query, description: "Drop the services and the bind mounts that are not allowed, with a warning, instead of refusing the file.", schema: {type: boolean}}]
      requestBody: {required: true, content: {application/yaml: {schema: {type: string}}}}
      responses:
        '200': {description: Conversion result, content: {application/json: {schema: {type: object, properties: {services: {type: array, items: {$ref: '#/components/schemas/ServiceCreate'}}, warnings: {type: array, items: {type: string}}}}}}}
        '422': {$ref: '#/components/responses/Error'}
  /environments/{environment_id}/import-compose-git:
    post:
