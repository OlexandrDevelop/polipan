openapi: 3.1.0
info:
  title: Polipan API
  version: 1.0.0
  description: >
    Public API of Polipan. This file is the source of truth for the server, the CLI, the Terraform provider
    and the web client (see docs/spec/05-api.md). Every operation has operationId and x-permission.
    x-permission is a permission from the matrix in docs/spec/10-security.md, or one of two special values:
    public (no login) and authenticated (any logged-in user, no matrix check).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - bearerToken: []
  - sessionCookie: []
tags:
  - {name: system}
  - {name: auth}
  - {name: org}
  - {name: nodes}
  - {name: projects}
  - {name: environments}
  - {name: services}
  - {name: deployments}
  - {name: releases}
  - {name: domains}
  - {name: volumes}
  - {name: variables}
  - {name: secrets}
  - {name: observability}
  - {name: templates}
  - {name: git}
  - {name: backups}
  - {name: alerts}
  - {name: audit}
  - {name: config}

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and readiness of the server
      tags: [system]
      security: []
      x-permission: public
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {description: Degraded (the database is down), content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /version:
    get:
      operationId: getVersion
      summary: Server version and API version
      tags: [system]
      security: []
      x-permission: public
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {version: {type: string}, commit: {type: string}, api: {type: string}}}}}}
  /setup/first-user:
    post:
      operationId: setupFirstUser
      summary: Create the first owner with the one-time setup token (404 after first use)
      tags: [system]
      security: []
      x-permission: public
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [setup_token, email, name, password], properties: {setup_token: {type: string}, email: {type: string, format: email}, name: {type: string}, password: {type: string, minLength: 12}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      operationId: login
      summary: Password login. Sets the session cookie. Needs totp_code if 2FA is on.
      tags: [auth]
      security: []
      x-permission: public
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string}, totp_code: {type: string}}}}}}
      responses:
        '200': {description: Logged in, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      x-permission: authenticated
      responses:
        '204': {description: Logged out}
  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start TOTP enrollment. Returns the otpauth URI once.
      tags: [auth]
      x-permission: authenticated
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {otpauth_uri: {type: string}}}}}}
  /auth/totp/verify:
    post:
      operationId: verifyTotp
      summary: Confirm TOTP enrollment. Returns recovery codes once.
      tags: [auth]
      x-permission: authenticated
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [totp_code], properties: {totp_code: {type: string}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {recovery_codes: {type: array, items: {type: string}}}}}}}
  /auth/totp/disable:
    post:
      operationId: disableTotp
      summary: Turn TOTP off for the current user (needs password)
      tags: [auth]
      x-permission: authenticated
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}}
      responses:
        '204': {description: Disabled}
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Send a password reset email (always returns 202)
      tags: [auth]
      security: []
      x-permission: public
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}}
      responses:
        '202': {description: Accepted}
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with the token from the email
      tags: [auth]
      security: []
      x-permission: public
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token, password], properties: {token: {type: string}, password: {type: string, minLength: 12}}}}}}
      responses:
        '204': {description: Password changed}
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation and set a password
      tags: [auth]
      security: []
      x-permission: public
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token, name, password], properties: {token: {type: string}, name: {type: string}, password: {type: string, minLength: 12}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
  /auth/sso/providers:
    get:
      operationId: listLoginProviders
      summary: List enabled SSO providers for the login page
      tags: [auth]
      security: []
      x-permission: public
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, kind: {type: string}, sso_required: {type: boolean, description: "The organization requires SSO: the page hides the password form"}, break_glass: {type: boolean, description: "An owner may still log in with a password and 2FA: the page shows a recovery login link"}}}}}}}
  /auth/sso/{provider_id}/start:
    get:
      operationId: startSsoLogin
      summary: Redirect to the identity provider (PKCE, state, nonce)
      tags: [auth]
      security: []
      x-permission: public
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      responses:
        '302': {description: Redirect}
  /auth/sso/{provider_id}/callback:
    get:
      operationId: finishSsoLogin
      summary: Identity provider callback. Sets the session cookie and redirects.
      tags: [auth]
      security: []
      x-permission: public
      parameters:
        - {$ref: '#/components/parameters/ProviderId'}
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '302': {description: Redirect}
  /me:
    get:
      operationId: getMe
      summary: Current user with org role and effective permissions
      tags: [auth]
      x-permission: authenticated
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
    patch:
      operationId: updateMe
      summary: Change own name or password
      tags: [auth]
      x-permission: authenticated
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {name: {type: string}, current_password: {type: string}, new_password: {type: string, minLength: 12}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
  /me/sessions:
    get:
      operationId: listMySessions
      summary: List own sessions
      tags: [auth]
      x-permission: authenticated
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Session'}}}}}
  /me/sessions/{session_id}:
    delete:
      operationId: revokeMySession
      summary: Revoke one own session
      tags: [auth]
      x-permission: authenticated
      parameters: [{name: session_id, in: path, required: true, schema: {type: string}}]
      responses:
        '204': {description: Revoked}

  /org:
    get:
      operationId: getOrg
      summary: Get the organization
      tags: [org]
      x-permission: org:read
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Org'}}}}
    patch:
      operationId: updateOrg
      summary: Update organization settings (name, retention, default domain, preview domain, sso_required, 2FA policy)
      tags: [org]
      x-permission: org:update
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrgUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Org'}}}}
    delete:
      operationId: deleteOrg
      summary: Delete the organization (soft delete, purge after 30 days). Needs the org slug in confirm.
      tags: [org]
      x-permission: org:delete
      parameters: [{name: confirm, in: query, required: true, schema: {type: string}}]
      responses:
        '204': {description: Deleted}
  /org/tokens/{token_id}:
    delete:
      operationId: revokeOrgToken
      summary: Revoke the API token of any user
      tags: [org]
      x-permission: token:manage
      parameters: [{$ref: '#/components/parameters/TokenId'}]
      responses:
        '204': {description: Revoked}
  /members:
    get:
      operationId: listMembers
      summary: List members of the organization
      tags: [org]
      x-permission: member:read
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Member'}}, next_cursor: {type: [string, 'null']}}}}}}
  /members/invitations:
    post:
      operationId: inviteMember
      summary: Invite a user by email with a role
      tags: [org]
      x-permission: member:manage
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, role], properties: {email: {type: string, format: email}, role: {$ref: '#/components/schemas/Role'}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
  /members/{user_id}:
    patch:
      operationId: updateMember
      summary: Change role or disable a member (409 last_owner if it would remove the last owner)
      tags: [org]
      x-permission: member:manage
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {role: {$ref: '#/components/schemas/Role'}, disabled: {type: boolean}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeMember
      summary: Remove a member. Sessions and tokens are revoked.
      tags: [org]
      x-permission: member:manage
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '204': {description: Removed}
        '409': {$ref: '#/components/responses/Error'}
  /members/{user_id}/sessions:
    delete:
      operationId: revokeMemberSessions
      summary: Revoke all sessions of a member
      tags: [org]
      x-permission: member:manage
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '204': {description: Revoked}
  /teams:
    get:
      operationId: listTeams
      summary: List teams
      tags: [org]
      x-permission: member:read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Team'}}}}}
    post:
      operationId: createTeam
      summary: Create a team
      tags: [org]
      x-permission: team:manage
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Team'}}}}
  /teams/{team_id}:
    patch:
      operationId: updateTeam
      summary: Rename a team
      tags: [org]
      x-permission: team:manage
      parameters: [{$ref: '#/components/parameters/TeamId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {name: {type: string}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Team'}}}}
    delete:
      operationId: deleteTeam
      summary: Delete a team and its project roles
      tags: [org]
      x-permission: team:manage
      parameters: [{$ref: '#/components/parameters/TeamId'}]
      responses:
        '204': {description: Deleted}
  /teams/{team_id}/members/{user_id}:
    put:
      operationId: addTeamMember
      summary: Add a user to a team
      tags: [org]
      x-permission: team:manage
      parameters: [{$ref: '#/components/parameters/TeamId'}, {$ref: '#/components/parameters/UserId'}]
      responses:
        '204': {description: Added}
    delete:
      operationId: removeTeamMember
      summary: Remove a user from a team
      tags: [org]
      x-permission: team:manage
      parameters: [{$ref: '#/components/parameters/TeamId'}, {$ref: '#/components/parameters/UserId'}]
      responses:
        '204': {description: Removed}
  /tokens:
    get:
      operationId: listTokens
      summary: List own API tokens (with all=true and token:manage, list all)
      tags: [org]
      x-permission: token:own
      parameters: [{name: all, in: query, schema: {type: boolean}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ApiToken'}}}}}
    post:
      operationId: createToken
      summary: Create an API token. The full token is returned once.
      tags: [org]
      x-permission: token:own
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, scopes], properties: {name: {type: string}, scopes: {type: array, items: {type: string, enum: [read, deploy, write, admin]}}, project_id: {type: string}, expires_at: {type: string, format: date-time}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ApiTokenCreated'}}}}
  /tokens/{token_id}:
    delete:
      operationId: revokeToken
      summary: Revoke one of your own tokens
      tags: [org]
      x-permission: token:own
      parameters: [{$ref: '#/components/parameters/TokenId'}]
      responses:
        '204': {description: Revoked}
  /sso-providers:
    get:
      operationId: listSsoProviders
      summary: List SSO providers (client secret never returned)
      tags: [org]
      x-permission: sso:manage
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SsoProvider'}}}}}
    post:
      operationId: createSsoProvider
      summary: Create an SSO provider
      tags: [org]
      x-permission: sso:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SsoProviderWrite'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/SsoProvider'}}}}
  /sso-providers/{provider_id}:
    patch:
      operationId: updateSsoProvider
      summary: Update an SSO provider
      tags: [org]
      x-permission: sso:manage
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SsoProviderWrite'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/SsoProvider'}}}}
    delete:
      operationId: deleteSsoProvider
      summary: Delete an SSO provider
      tags: [org]
      x-permission: sso:manage
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      responses:
        '204': {description: Deleted}
  /sso-providers/{provider_id}/group-mappings:
    get:
      operationId: listGroupMappings
      summary: List group to role mappings
      tags: [org]
      x-permission: sso:manage
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GroupMapping'}}}}}
    put:
      operationId: replaceGroupMappings
      summary: Replace all group mappings of a provider
      tags: [org]
      x-permission: sso:manage
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GroupMapping'}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GroupMapping'}}}}}
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: Search the audit log
      tags: [audit]
      x-permission: audit:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: actor_id, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: target_type, in: query, schema: {type: string}}
        - {name: target_id, in: query, schema: {type: string}}
        - {name: project_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}, next_cursor: {type: [string, 'null']}}}}}}
  /audit-events/export:
    get:
      operationId: exportAuditEvents
      summary: Export audit events as JSON lines
      tags: [audit]
      x-permission: audit:export
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: JSON lines, content: {application/x-ndjson: {schema: {type: string}}}}
  /audit/verify:
    get:
      operationId: verifyAuditChain
      summary: Verify the hash chain
      tags: [audit]
      x-permission: audit:read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, required: [ok], properties: {ok: {type: boolean}, first_broken_seq: {type: integer}, checked_rows: {type: integer}}}}}}

  /nodes:
    get:
      operationId: listNodes
      summary: List nodes
      tags: [nodes]
      x-permission: node:read
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Node'}}}}}
    post:
      operationId: createNodeJoinToken
      summary: Create a join token and the install command for a new node
      tags: [nodes]
      x-permission: node:manage
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}, labels: {type: object, additionalProperties: {type: string}}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object, properties: {node_id: {type: string}, token: {type: string}, install_command: {type: string}, expires_at: {type: string, format: date-time}}}}}}
  /nodes/{node_id}:
    get:
      operationId: getNode
      summary: Get a node
      tags: [nodes]
      x-permission: node:read
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
    patch:
      operationId: updateNode
      summary: Change name or labels
      tags: [nodes]
      x-permission: node:manage
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {name: {type: string}, labels: {type: object, additionalProperties: {type: string}}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
    delete:
      operationId: deleteNode
      summary: Delete a node (409 node_not_empty unless force=true)
      tags: [nodes]
      x-permission: node:manage
      parameters: [{$ref: '#/components/parameters/NodeId'}, {name: force, in: query, schema: {type: boolean}}]
      responses:
        '204': {description: Deleted}
        '409': {$ref: '#/components/responses/Error'}
  /nodes/{node_id}/cordon:
    post:
      operationId: cordonNode
      summary: Stop scheduling new workloads on the node
      tags: [nodes]
      x-permission: node:manage
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
  /nodes/{node_id}/uncordon:
    post:
      operationId: uncordonNode
      summary: Allow scheduling on the node again
      tags: [nodes]
      x-permission: node:manage
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
  /nodes/{node_id}/drain:
    post:
      operationId: drainNode
      summary: Move all workloads away with blue-green deploys
      tags: [nodes]
      x-permission: node:manage
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
  /nodes/{node_id}/maintenance:
    post:
      operationId: setNodeMaintenance
      summary: Put a drained node into maintenance (or take it out with enabled=false)
      tags: [nodes]
      x-permission: node:manage
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
  /nodes/{node_id}/self-check:
    post:
      operationId: runNodeSelfCheck
      summary: Ask the agent to check Docker, Caddy and WireGuard
      tags: [nodes]
      x-permission: node:manage
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {docker: {type: boolean}, caddy: {type: boolean}, wireguard: {type: boolean}, clock_skew_ms: {type: integer}}}}}}
  /nodes/{node_id}/metrics:
    get:
      operationId: getNodeMetrics
      summary: Node metrics time series
      tags: [observability]
      x-permission: metrics:read
      parameters: [{$ref: '#/components/parameters/NodeId'}, {$ref: '#/components/parameters/MetricNames'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Step'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MetricResult'}}}}
  /nodes/{node_id}/orphan-volumes:
    get:
      operationId: listOrphanVolumes
      summary: List volumes on the node that no service uses
      tags: [nodes]
      x-permission: node:read
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {type: object, properties: {name: {type: string}, size_bytes: {type: integer}, last_service: {type: string}}}}}}}
  /orphan-volumes/{node_id}/{name}:
    delete:
      operationId: deleteOrphanVolume
      summary: Delete an orphan volume for good
      tags: [nodes]
      x-permission: volume:manage
      parameters: [{$ref: '#/components/parameters/NodeId'}, {name: name, in: path, required: true, schema: {type: string}}]
      responses:
        '204': {description: Deleted}

  /projects:
    get:
      operationId: listProjects
      summary: List projects the user can see
      tags: [projects]
      x-permission: project:read
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
