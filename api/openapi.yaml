    AuditEvent:
      type: object
      properties: {seq: {type: integer}, id: {type: string}, actor_type: {type: string, enum: [user, token, system, agent, sso]}, actor_id: {type: string}, action: {type: string}, target_type: {type: string}, target_id: {type: string}, project_id: {type: string}, diff: {type: object, additionalProperties: true}, ip: {type: string}, user_agent: {type: string}, request_id: {type: string}, hash: {type: string}, created_at: {type: string, format: date-time}}
    Node:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        state: {type: string, enum: [pending, ready, suspect, down, draining, cordoned, maintenance]}
        labels: {type: object, additionalProperties: {type: string}}
        public_ip: {type: string}
        mesh_ip: {type: string}
        os: {type: string}
        arch: {type: string}
        docker_version: {type: string}
        agent_version: {type: string}
        capacity: {type: object, properties: {cpu_millis: {type: integer}, memory_bytes: {type: integer}, disk_bytes: {type: integer}}}
        usage: {type: object, properties: {cpu_millis: {type: integer}, memory_bytes: {type: integer}, disk_bytes: {type: integer}}}
        last_heartbeat_at: {type: string, format: date-time}
        workload_count: {type: integer}
        mesh_subnet: {type: string, description: "the /24 of the node in mesh_cidr"}
