    DomainWrite:
      type: object
      properties: {host: {type: string}, path_prefix: {type: string, default: /}, container_port: {type: integer}, https: {type: boolean, default: true}, redirect_www: {type: string, enum: [to_www, to_apex]}, ingress_node_ids: {type: array, items: {type: string}}, basic_auth_secret: {type: string}, ip_allow: {type: array, items: {type: string}}, max_body_bytes: {type: integer}}
    Volume:
      type: object
      properties: {id: {type: string}, name: {type: string}, kind: {type: string, enum: [volume, bind, tmpfs]}, mount_path: {type: string}, node_id: {type: string}, access_mode: {type: string, enum: [single_writer, shared]}, size_limit_bytes: {type: integer}, usage_bytes: {type: integer}}
    VolumeWrite:
      type: object
      properties: {name: {type: string}, kind: {type: string, enum: [volume, bind, tmpfs]}, mount_path: {type: string}, access_mode: {type: string, enum: [single_writer, shared]}, size_limit_bytes: {type: integer}}
    Variable:
