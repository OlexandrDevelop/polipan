        dry_run: {type: boolean, default: false}
        plan_hash: {type: string}
        allow_missing: {type: array, items: {type: string}}
        create_missing: {type: boolean, default: false}
        include_databases: {type: boolean, default: false}
        strategy: {$ref: '#/components/schemas/Strategy'}
    PromotionPlan:
      type: object
      properties:
        plan_hash: {type: string}
        items: {type: array, items: {type: object, properties: {service: {type: string}, source_release_id: {type: string}, source_release_number: {type: integer}, target_service_id: {type: string}, target_release_id: {type: string}, create: {type: boolean, description: "The service does not exist in the target and is created (create_missing)"}, image_digest: {type: string}, changes: {type: array, items: {$ref: '#/components/schemas/FieldChange'}}, variables_added: {type: array, items: {type: string}, description: "Names only, also for secrets"}, variables_removed: {type: array, items: {type: string}}, missing_variables: {type: array, items: {type: string}}, allowed_missing: {type: array, items: {type: string}}, strategy: {$ref: '#/components/schemas/Strategy'}, warnings: {type: array, items: {$ref: '#/components/schemas/Warning'}}, skipped_reason: {type: string, description: "database_skipped, no_live_release or missing_in_target"}}}}
        warnings: {type: array, items: {$ref: '#/components/schemas/Warning'}}
    FieldChange:
