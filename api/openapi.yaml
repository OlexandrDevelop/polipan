      tags: [templates]
      x-permission: service:create
      parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {name: dry_run, in: query, schema: {type: boolean}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ComposeGitRequest'}}}}
      responses:
        '200': {description: Conversion result, content: {application/json: {schema: {type: object, properties: {services: {type: array, items: {$ref: '#/components/schemas/ServiceCreate'}}, warnings: {type: array, items: {type: string}}}}}}}
