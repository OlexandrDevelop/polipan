        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}
    patch:
      operationId: updateEnvironment
      summary: Update an environment. Changing protected needs admin.
      tags: [environments]
      x-permission: env:update
      parameters: [{$ref: '#/components/parameters/EnvironmentId'}]
