    Member:
      type: object
      properties: {user_id: {type: string}, email: {type: string}, name: {type: string}, role: {$ref: '#/components/schemas/Role'}, source: {type: string, enum: [manual, sso]}, status: {type: string, enum: [invited, active, disabled]}, last_login_at: {type: string, format: date-time}, invite_url: {type: string, description: "Link to accept an invitation. Only in the answer of inviteMember: there is no email server, the admin sends it."}}
    Team:
      type: object
      properties: {id: {type: string}, name: {type: string}, member_ids: {type: array, items: {type: string}}}
    ProjectRole:
      type: object
      required: [role]
      properties: {user_id: {type: string}, team_id: {type: string}, project_id: {type: string, description: "Set in GET /me, where the roles of the user come from many projects"}, role: {type: string, enum: [admin, developer, viewer]}}
    ApiToken:
      type: object
      properties: {id: {type: string}, name: {type: string}, token_prefix: {type: string}, scopes: {type: array, items: {type: string}}, project_id: {type: string}, expires_at: {type: string, format: date-time}, last_used_at: {type: string, format: date-time}, revoked_at: {type: string, format: date-time}}
    ApiTokenCreated:
      allOf:
        - {$ref: '#/components/schemas/ApiToken'}
        - {type: object, properties: {token: {type: string, description: "Full token, shown once"}}}
    SsoProvider:
      type: object
      properties: {id: {type: string}, kind: {type: string, enum: [oidc, google, github]}, name: {type: string}, issuer_url: {type: string}, client_id: {type: string}, scopes: {type: array, items: {type: string}}, groups_claim: {type: string}, allowed_domains: {type: array, items: {type: string}}, default_role: {$ref: '#/components/schemas/Role'}, auto_create_users: {type: boolean}, enabled: {type: boolean}}
    SsoProviderWrite:
      allOf:
        - {$ref: '#/components/schemas/SsoProvider'}
