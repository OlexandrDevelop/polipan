  /services/{service_id}/metrics:
    get:
      operationId: getServiceMetrics
      summary: Service metrics time series
      tags: [observability]
      x-permission: metrics:read
      parameters: [{$ref: '#/components/parameters/ServiceId'}, {$ref: '#/components/parameters/MetricNames'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Step'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MetricResult'}}}}
