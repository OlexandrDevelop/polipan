slug: plausible
version: 1.0.0
name: Plausible Analytics
description: Simple, privacy friendly web analytics with PostgreSQL and ClickHouse.
icon: https://plausible.io/images/icon/plausible_logo.png
tags: [analytics]
inputs:
  - { name: domain, label: Domain, type: domain, required: true }
  - { name: secret_key_base, label: Secret key base, type: secret, generate: true }
services:
  postgres:
    type: database
    db: { engine: postgres, version: "16" }
  clickhouse:
    source: { image: { name: "clickhouse/clickhouse-server:24.3-alpine" } }
    ports: [8123]
    volumes:
      - { name: data, path: /var/lib/clickhouse }
    healthcheck: { type: tcp, port: 8123, start_period: 30s }
    resources: { memory: 1Gi }
  plausible:
    source: { image: { name: "ghcr.io/plausible/community-edition:v2.1.4" } }
    ports: [8000]
    command: ["sh", "-c", "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"]
    env:
      BASE_URL: "https://${{inputs.domain}}"
      DATABASE_URL: "${{db.postgres.URL}}"
      CLICKHOUSE_DATABASE_URL: "http://${{services.clickhouse.host}}:8123/plausible_events_db"
      DISABLE_REGISTRATION: "invite_only"
    secrets: [SECRET_KEY_BASE]
    domains:
      - { host: "${{inputs.domain}}", port: 8000 }
    healthcheck: { type: tcp, port: 8000, start_period: 90s }
    depends_on: [postgres, clickhouse]
