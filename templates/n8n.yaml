slug: n8n
version: 1.0.0
name: n8n
description: Workflow automation with a PostgreSQL database.
icon: https://n8n.io/favicon.ico
tags: [automation]
inputs:
  - { name: domain, label: Domain, type: domain, required: true }
  - { name: n8n_encryption_key, label: Encryption key, type: secret, generate: true }
services:
  n8n-db:
    type: database
    db: { engine: postgres, version: "16" }
  n8n:
    source: { image: { name: "n8nio/n8n:1.70.3" } }
    ports: [5678]
    env:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: "${{db.n8n-db.HOST}}"
      DB_POSTGRESDB_PORT: "${{db.n8n-db.PORT}}"
      DB_POSTGRESDB_DATABASE: "${{db.n8n-db.NAME}}"
      DB_POSTGRESDB_USER: "${{db.n8n-db.USER}}"
      DB_POSTGRESDB_PASSWORD: "${{db.n8n-db.PASSWORD}}"
      N8N_HOST: "${{inputs.domain}}"
      N8N_PROTOCOL: https
      WEBHOOK_URL: "https://${{inputs.domain}}/"
    secrets: [N8N_ENCRYPTION_KEY]
    volumes:
      - { name: data, path: /home/node/.n8n }
    domains:
      - { host: "${{inputs.domain}}", port: 5678 }
    healthcheck: { type: tcp, port: 5678, start_period: 60s }
    depends_on: [n8n-db]
