{{define "content"}}
<div class="narrow">
<p class="kicker">account</p>
<h1>Register</h1>
{{template "error" .}}
<form method="post" action="/register" class="form">
  {{template "trap" .}}
  <label for="username">Name (3 to 24 letters, numbers, - or _)</label>
  <input id="username" name="username" required minlength="3" maxlength="24" autocomplete="username" value="{{index .Form "username"}}">
  <label for="email">Email (we never show it)</label>
  <input id="email" name="email" type="email" required maxlength="254" autocomplete="email" value="{{index .Form "email"}}">
  <label for="password">Password (at least 10 characters)</label>
  <input id="password" name="password" type="password" required minlength="10" maxlength="200" autocomplete="new-password">
  <button type="submit" class="btn">Create account</button>
</form>
<p class="muted small">There is no password reset by email yet. Keep your password safe.</p>
</div>
{{end}}
