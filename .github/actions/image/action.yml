# SPDX-License-Identifier: Apache-2.0
# Builds one image for linux/amd64 and linux/arm64, pushes it, signs it with cosign (keyless) and attaches
# an SPDX SBOM as a signed attestation. Used by the release workflow (REQ-OSS-004).
# The caller must have run docker/login-action and has the permissions packages: write and id-token: write.
name: build, sign and attest an image
description: Build and push an image, sign it by digest and attach its SBOM

inputs:
  name:
    description: Image name without registry, for example polipan-server
    required: true
  file:
    description: Dockerfile
    required: true
  namespace:
    description: Registry and owner in lower case, for example ghcr.io/olexandrdevelop
    required: true
  version:
    description: The release tag, for example v1.0.0
    required: true
  commit:
    description: Short commit (12 characters)
    required: true
  source-date-epoch:
    description: Commit time in seconds. Layers get this time, so the image does not depend on the build time.
    required: true
  latest:
    description: "true: also tag the image latest"
    required: true
  build-args:
    description: More build arguments, one NAME=VALUE per line
    required: false
    default: ''

outputs:
  digest:
    description: The digest of the pushed image index
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        IMAGE: ${{ inputs.namespace }}/${{ inputs.name }}
        VERSION: ${{ inputs.version }}
        LATEST: ${{ inputs.latest }}
      run: |
        {
          echo "tags<<EOF"
          echo "$IMAGE:$VERSION"
          if [ "$LATEST" = "true" ]; then echo "$IMAGE:latest"; fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - id: build
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      env:
        SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
      with:
        context: .
        file: ${{ inputs.file }}
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        provenance: mode=max
        sbom: false
        outputs: type=image,push=true,rewrite-timestamp=true
        build-args: |
          VERSION=${{ inputs.version }}
          COMMIT=${{ inputs.commit }}
          SOURCE_DATE_EPOCH=${{ inputs.source-date-epoch }}
          ${{ inputs.build-args }}
    - name: Sign the image
      shell: bash
      env:
        REF: ${{ inputs.namespace }}/${{ inputs.name }}@${{ steps.build.outputs.digest }}
      run: cosign sign --yes "$REF"
    - name: Make the SBOM of the image
      uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
      with:
        image: ${{ inputs.namespace }}/${{ inputs.name }}@${{ steps.build.outputs.digest }}
        format: spdx-json
        output-file: ${{ runner.temp }}/${{ inputs.name }}.spdx.json
        upload-artifact: false
        upload-release-assets: false
    - name: Attach the SBOM as a signed attestation
      shell: bash
      env:
        REF: ${{ inputs.namespace }}/${{ inputs.name }}@${{ steps.build.outputs.digest }}
        SBOM: ${{ runner.temp }}/${{ inputs.name }}.spdx.json
      run: cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"
