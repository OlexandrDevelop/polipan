# SPDX-License-Identifier: Apache-2.0
# Builds the server and the agent image on every push to main and pushes them to ghcr.io as ":latest".
# The install script of the main branch (deploy/install.sh) uses these images, so one command installs
# the newest main without a release:
#
#   curl -fsSL https://raw.githubusercontent.com/OlexandrDevelop/polipan/main/deploy/install.sh | sudo sh
#
# A release (a tag like v1.0.0, see release.yml) is the signed and pinned way. This workflow is the quick one.
# The first time, set both packages to "Public" (profile, Packages, the package, Package settings), so a
# server can pull them without a login.
name: publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - 'forum/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: polipan-server
            file: deploy/docker/server.Dockerfile
          - name: polipan-agent
            file: deploy/docker/agent.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: ns
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "namespace=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ns.outputs.namespace }}/${{ matrix.name }}:latest
            ${{ steps.ns.outputs.namespace }}/${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
            AGENT_IMAGE_REPO=${{ steps.ns.outputs.namespace }}/polipan-agent
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
